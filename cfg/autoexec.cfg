save_disableautosave 1
save_async 1
con_log_channel_mode 0
achievement_disable 1
con_filter_enable 1
con_filter_text_out "ISteamUserStats"
cc_panorama 1
hud_saytext_time 0
sv_cheats 1
cl_player_render_in_shadows_view 1
con_logfile console.log
r_paintblob_timeout_for_recycling_fragments 500

// Workaround for refract bugs. Just unlimit the number of FB updates per frame. Could be very bad for perf in some cases
r_unlimitedrefract 0

// Force full depth pass to avoid buggy depth resolve on ATI/Intel in dx9. No noticeable performance change.
mat_resolveFullFrameDepth 0


// Some other engine things
das_max_z_trace_length 100000
mat_motion_blur_forward_enabled 1
mat_motion_blur_falling_min 8

// Pivot: Temporary. Setting hardware morph to 1 completely breaks HL2 FACS flex controllers and causes mdls like Breen,
// Kleiner, Alyx and Citizens to exhibit dorcelessness (literally), so I'm setting this to 0 for the time being until we
// figure out a fix that allows both FACS and ASW/SFM hardware morph flexes to co-exist.
r_hwmorph 0

mat_brightness 1.0



